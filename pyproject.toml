[project]
name = "phantombench"
version = "0.1.0"
description = "Benchmark harness: does an LLM code reviewer catch injected defects in real merged PRs?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "matplotlib>=3.8",
]

[project.scripts]
phantombench = "phantombench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
